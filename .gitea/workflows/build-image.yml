# bsky-integration への push を trigger に container image を build + Gitea registry へ push。
# tag は 2 種類: immutable な `<upstream-version>-bsky-<short_sha>` と rolling な `bsky-latest`。
# Quadlet 側 (mi-host CT 200) は `bsky-latest` を AutoUpdate=registry で見る。
#
# Job container: debian:trixie-slim。Harbor proxy の "no Critical CVEs" pull policy が
# gitea/runner-images:ubuntu-latest を拒否するようになり (2026-09、job が起動前に cancelled)、
# ubuntu-latest label のまま container.image で差し替える。image に node が無いので JS action
# (actions/checkout, docker/*) は使わず、git clone + apt の docker-cli / docker-buildx で
# 同じ手順を組む。docker CLI はランナーがマウントする /var/run/docker.sock (= podman socket)
# に向く。
name: Build & Push Image

on:
  push:
    branches: [bsky-integration]
    # ドキュメント・エージェント設定・CI 定義のみの push では image を再ビルドしない。
    # image label に revision sha を焼き込んでいるため、内容が同じでも再ビルドすると
    # digest が変わり podman auto-update が本番を再起動してしまう (= 全クライアントの
    # WS 切断)。2026-08-12 に docs のみのコミットで無駄な再起動が発生した対策。
    # 変更ファイル「全て」が下記に一致した場合のみスキップされる (コード混在 push はビルドされる)。
    # 意図的にビルドしたい場合は Gitea UI から workflow_dispatch で手動実行できる。
    paths-ignore:
      - '**.md'
      - '.claude/**'
      - '.agents/**'
      - '.gitea/**'
      - '.github/**'
      - '.vscode/**'
  workflow_dispatch:
    inputs:
      push:
        description: 'Push the built image to the registry (false = build only, dry run)'
        type: choice
        options: ['true', 'false']
        default: 'true'

permissions:
  contents: read

env:
  REGISTRY: git.msjp.pro
  IMAGE: vtf/misskey-bsky-fork
  # upstream の base version。fork patch を当てている version を反映。
  # rebase で upstream 系列が上がったらこの値も bump する。
  BASE_VERSION: 2026.10.0

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/debian:trixie-slim
    env:
      DEBIAN_FRONTEND: noninteractive
    defaults:
      run:
        shell: bash   # the image's sh is dash
    steps:
      - name: Toolchain
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            git ca-certificates docker-cli docker-buildx > /dev/null
          docker version --format '{{.Client.Version}} -> {{.Server.Platform.Name}}'
          docker buildx version

      # actions/checkout の代替。まず push された sha そのものを fetch し、
      # 届かない場合 (古い sha が GC 済など) は branch 先端に fallback する。
      - name: Checkout
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          URL="https://x:${GITEA_TOKEN}@${GITHUB_SERVER_URL#https://}/${GITHUB_REPOSITORY}.git"
          git init -q src
          cd src
          git remote add origin "$URL"
          if git fetch -q --depth 1 origin "$GITHUB_SHA" 2>/dev/null; then
            git checkout -q FETCH_HEAD
          else
            echo "::warning::could not fetch $GITHUB_SHA directly; building branch head of $GITHUB_REF_NAME instead"
            git fetch -q --depth 1 origin "$GITHUB_REF_NAME"
            git checkout -q FETCH_HEAD
          fi
          git log --oneline -1

      - name: Compute tags
        id: tags
        working-directory: src
        run: |
          SHA=$(git rev-parse --short HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "sha_full=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "image_sha=${REGISTRY}/${IMAGE}:${BASE_VERSION}-bsky-${SHA}" >> "$GITHUB_OUTPUT"
          echo "image_latest=${REGISTRY}/${IMAGE}:bsky-latest" >> "$GITHUB_OUTPUT"

      # secrets.GITEA_TOKEN は repo scope の short-lived token で packages
      # registry の push 権限を含まない。VTF user の personal access token を
      # REGISTRY_TOKEN として repo secret に登録して使う (write:package scope 必須)。
      # 認証情報は docker CLI が X-Registry-Auth で daemon (podman) に渡す。
      - name: Login to Gitea container registry
        if: github.event_name != 'workflow_dispatch' || inputs.push != 'false'
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          echo "$REGISTRY_TOKEN" | docker login "$REGISTRY" -u VTF --password-stdin

      # buildx の default builder (driver: docker) = daemon 側でビルドし、結果を daemon に
      # 残す (--load)。docker-container driver だと push/load に buildkit の containerd
      # 認証が絡む。
      # push は buildkit (containerd resolver) ではなく docker CLI で行う。
      # buildkit の token 取得は Gitea 相手に不安定で、runs #931-#942 が
      # "authorization server did not include a token in the response" で失敗し続けた
      # (docker login や mi-host 側 podman pull の GET /v2/token 経路は安定)。
      # registry buildcache も buildkit 認証依存で毎回 import に失敗して
      # 実質無効だったため撤去済 (フルビルドは実測 ~5 分)。
      # Misskey 公式 image は linux/amd64 のみ。Misskey-bsky-fork も pve2 上の
      # CT 200 (x86_64) のみで動かすので amd64 単一で OK。
      # Image label として io.containers.autoupdate=registry を付与すると、
      # mi-host 側で podman auto-update が registry 上の :bsky-latest を見て
      # digest 差分があるときだけ pull + restart する。
      - name: Build image
        working-directory: src
        run: |
          docker buildx build \
            --load \
            --platform linux/amd64 \
            --build-arg NODE_ENV=production \
            --label io.containers.autoupdate=registry \
            --label "org.opencontainers.image.source=${{ gitea.server_url }}/${{ gitea.repository }}" \
            --label "org.opencontainers.image.revision=${{ steps.tags.outputs.sha_full }}" \
            --label "org.opencontainers.image.version=${{ env.BASE_VERSION }}-bsky-${{ steps.tags.outputs.sha }}" \
            -t "${{ steps.tags.outputs.image_sha }}" \
            .
          docker image inspect "${{ steps.tags.outputs.image_sha }}" --format '{{.Id}} {{.Config.Labels}}'

      # まず immutable tag だけを push し、成功した場合のみ後段で rolling な bsky-latest を
      # push する。以前は 2 tag 同時 push で「bsky-latest の push 成功 → immutable tag の
      # push が失敗 = job は failure なのに本番へは auto-update で配備される」事故が起きた
      # (2026-08-11 障害)。この順序なら失敗した build が bsky-latest に載ることはない。
      - name: Push immutable tag
        if: github.event_name != 'workflow_dispatch' || inputs.push != 'false'
        run: |
          for i in 1 2 3 4 5; do
            if docker push "${{ steps.tags.outputs.image_sha }}"; then
              exit 0
            fi
            echo "docker push failed (attempt $i/5); retrying in 10s..."
            sleep 10
          done
          echo "::error::failed to push immutable tag after 5 attempts"
          exit 1

      # 近い時刻の push が並行でビルドされると、古いビルドが後に終わって bsky-latest を
      # 上書きし、本番が古い版に戻る (msjp-live で 2026-10-02 に発生)。ブランチは毎日 rebase と
      # force-push を受けるため「今の latest の子孫か」では判定できない。そこで、このコミットが
      # ブランチ先端と同じか、先端までの差分が paths-ignore 対象 (ビルドされない) だけのとき
      # に限って bsky-latest を進める。それ以外は、より新しいビルドに任せる。
      - name: Check this build is the newest
        id: newest
        if: github.event_name != 'workflow_dispatch' || inputs.push != 'false'
        working-directory: src
        run: |
          THIS="${{ steps.tags.outputs.sha_full }}"
          git fetch -q --depth 200 origin "$GITHUB_REF_NAME"
          TIP=$(git rev-parse FETCH_HEAD)
          promote=false
          if [ "$THIS" = "$TIP" ]; then
            promote=true
          elif git merge-base --is-ancestor "$THIS" "$TIP" 2>/dev/null; then
            rest=$(git diff --name-only "$THIS" "$TIP" | grep -vE '\.md$|^\.claude/|^\.agents/|^\.gitea/|^\.github/|^\.vscode/' || true)
            [ -z "$rest" ] && promote=true
          fi
          echo "promote=$promote" >> "$GITHUB_OUTPUT"
          if [ "$promote" != true ]; then
            echo "::notice::$THIS is not the newest buildable commit (branch tip $TIP): bsky-latest is left as is"
          fi

      - name: Promote to bsky-latest
        if: (github.event_name != 'workflow_dispatch' || inputs.push != 'false') && steps.newest.outputs.promote == 'true'
        run: |
          docker tag "${{ steps.tags.outputs.image_sha }}" "${{ steps.tags.outputs.image_latest }}"
          for i in 1 2 3 4 5; do
            if docker push "${{ steps.tags.outputs.image_latest }}"; then
              echo "bsky-latest now points at ${{ steps.tags.outputs.image_sha }}"
              exit 0
            fi
            echo "docker push failed (attempt $i/5); retrying in 10s..."
            sleep 10
          done
          echo "::error::failed to promote bsky-latest after 5 attempts"
          exit 1

      # dry run (workflow_dispatch, push=false) では daemon に残した image を消して
      # ランナーのディスクを汚さない。
      - name: Discard dry-run image
        if: github.event_name == 'workflow_dispatch' && inputs.push == 'false'
        run: |
          docker rmi "${{ steps.tags.outputs.image_sha }}" || true
          echo "dry run: image was built but not pushed"

      - name: Summary
        if: github.event_name != 'workflow_dispatch' || inputs.push != 'false'
        run: |
          {
            echo "## Image published"
            echo ""
            echo "- \`${{ steps.tags.outputs.image_sha }}\`"
            echo "- \`${{ steps.tags.outputs.image_latest }}\` (rolling)"
            echo ""
            echo "mi-host (CT 200) is configured with \`AutoUpdate=registry\` on bsky-latest;"
            echo "the 5-minute podman-auto-update.timer will pull and restart within ~5 min."
          } >> "$GITHUB_STEP_SUMMARY"
