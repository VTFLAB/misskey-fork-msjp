# bsky-integration への push を trigger に container image を build + Gitea registry へ push。
# tag は 2 種類: immutable な `<upstream-version>-bsky-<short_sha>` と rolling な `bsky-latest`。
# Quadlet 側 (mi-host CT 200) は `bsky-latest` を AutoUpdate=registry で見る。
name: Build & Push Image

on:
  push:
    branches: [bsky-integration]
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: git.msjp.pro
  IMAGE: vtf/misskey-bsky-fork
  # upstream の base version。fork patch を当てている version を反映。
  # rebase で upstream 系列が上がったらこの値も bump する。
  BASE_VERSION: 2026.7.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute tags
        id: tags
        run: |
          SHA=$(git rev-parse --short HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "image_sha=${REGISTRY}/${IMAGE}:${BASE_VERSION}-bsky-${SHA}" >> "$GITHUB_OUTPUT"
          echo "image_latest=${REGISTRY}/${IMAGE}:bsky-latest" >> "$GITHUB_OUTPUT"
          echo "image_buildcache=${REGISTRY}/${IMAGE}:buildcache" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Gitea container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          # secrets.GITEA_TOKEN は repo scope の short-lived token で packages
          # registry の push 権限を含まない。VTF user の personal access token を
          # REGISTRY_TOKEN として repo secret に登録して使う (write:package scope 必須)。
          username: VTF
          password: ${{ secrets.REGISTRY_TOKEN }}

      # まず immutable tag だけを push し、成功した場合のみ後段で rolling な bsky-latest を
      # 付け替える。以前は 2 tag 同時 push で「bsky-latest の push 成功 → immutable tag の
      # push が registry token 不調で失敗 = job は failure なのに本番へは自動配備される」
      # 事故が起きた (2026-08-11 障害)。この順序なら失敗した build が bsky-latest に載らない。
      - name: Build and push (immutable tag)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Misskey 公式 image は linux/amd64 のみ。Misskey-bsky-fork も pve2 上の
          # CT 200 (x86_64) のみで動かすので amd64 単一で OK。
          platforms: linux/amd64
          tags: ${{ steps.tags.outputs.image_sha }}
          build-args: |
            NODE_ENV=production
          # Image label として io.containers.autoupdate=registry を付与すると、
          # mi-host 側で podman auto-update が registry 上の :bsky-latest を見て
          # digest 差分があるときだけ pull + restart する。
          labels: |
            io.containers.autoupdate=registry
            org.opencontainers.image.source=${{ gitea.server_url }}/${{ gitea.repository }}
            org.opencontainers.image.revision=${{ gitea.sha }}
            org.opencontainers.image.version=${{ env.BASE_VERSION }}-bsky-${{ steps.tags.outputs.sha }}
          cache-from: type=registry,ref=${{ steps.tags.outputs.image_buildcache }}
          cache-to: type=registry,ref=${{ steps.tags.outputs.image_buildcache }},mode=max

      # build 成功時のみ registry 上で bsky-latest tag を immutable tag に付け替える。
      # Gitea の registry token endpoint は一時的に token を返さないことがある
      # ("authorization server did not include a token in the response"、runs #931-939 の
      # 失敗原因) ため、リトライで吸収する。
      - name: Promote to bsky-latest
        run: |
          for i in 1 2 3 4 5; do
            if docker buildx imagetools create \
              -t "${{ steps.tags.outputs.image_latest }}" \
              "${{ steps.tags.outputs.image_sha }}"; then
              echo "bsky-latest now points at ${{ steps.tags.outputs.image_sha }}"
              exit 0
            fi
            echo "imagetools create failed (attempt $i/5); retrying in 10s..."
            sleep 10
          done
          echo "::error::failed to promote bsky-latest after 5 attempts"
          exit 1

      - name: Summary
        run: |
          {
            echo "## Image published"
            echo ""
            echo "- \`${{ steps.tags.outputs.image_sha }}\`"
            echo "- \`${{ steps.tags.outputs.image_latest }}\` (rolling)"
            echo ""
            echo "mi-host (CT 200) is configured with \`AutoUpdate=registry\` on bsky-latest;"
            echo "the 5-minute podman-auto-update.timer will pull and restart within ~5 min."
          } >> "$GITHUB_STEP_SUMMARY"
