# Upstream (github.com/misskey-dev/misskey) → bsky-integration 自動 rebase。
# 毎日 18:00 UTC = 03:00 JST に schedule で走る。手動でも workflow_dispatch から走らせられる。
# conflict 発生時は rebase --abort して Gitea Issue を立てて exit 1 (人間が手動 rebase)。
# open な conflict Issue が既にあれば新規起票せず、その Issue を使い回す (重複防止)。
# pnpm-lock.yaml だけの conflict は upstream 側で進め、rebase 後に lockfile を再生成して commit する。
name: Upstream Sync

# 2026-07-31: base を stable tag 2026.7.0 (master 系列) に載せ替えたため schedule を復活。
# alpha (develop 系列) tag をベースにする場合は、master への nightly rebase が base を
# 巻き戻してしまうので schedule を再び停止すること (2026-07-03 の前例を参照)。
on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * *'

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    # Job container: debian:trixie-slim (理由は build-image.yml 冒頭を参照)。node が無いので
    # actions/checkout は使わず、GITEA_TOKEN 入り URL で git clone する。
    container:
      image: docker.io/library/debian:trixie-slim
    env:
      DEBIAN_FRONTEND: noninteractive
    defaults:
      run:
        shell: bash   # the image's sh is dash
    steps:
      - name: Toolchain
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git ca-certificates curl jq > /dev/null

      # GITEA_TOKEN は workflow が自動で発行する短命 token。
      # force-with-lease push (origin URL に埋め込み) と issue 作成の両方に使う。
      - name: Checkout bsky-integration with full history
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          git clone -q -b bsky-integration \
            "https://x:${GITEA_TOKEN}@${GITHUB_SERVER_URL#https://}/${GITHUB_REPOSITORY}.git" src
          git -C src log --oneline -1

      - name: Configure git identity
        working-directory: src
        run: |
          git config user.name "gitea-actions[bot]"
          git config user.email "actions@git.msjp.pro"

      - name: Fetch upstream/master
        id: fetch
        working-directory: src
        run: |
          git remote add upstream https://github.com/misskey-dev/misskey.git
          git fetch upstream master --quiet
          UP_HEAD=$(git rev-parse upstream/master)
          UP_SHORT=$(git rev-parse --short upstream/master)
          echo "upstream_head=$UP_HEAD" >> "$GITHUB_OUTPUT"
          echo "upstream_short=$UP_SHORT" >> "$GITHUB_OUTPUT"

      - name: Skip if already rebased
        id: check
        working-directory: src
        run: |
          BASE=$(git merge-base bsky-integration upstream/master)
          if [ "$BASE" = "${{ steps.fetch.outputs.upstream_head }}" ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::bsky-integration already contains upstream/master (${{ steps.fetch.outputs.upstream_short }}). Nothing to rebase."
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Attempt rebase onto upstream/master
        id: rebase
        if: steps.check.outputs.needed == 'true'
        working-directory: src
        run: |
          set +e
          git rebase upstream/master >/tmp/rebase.log 2>&1
          RC=$?
          # pnpm-lock.yaml だけの conflict は自動で進める (2026-10-06、Dependabot 対応の
          # overrides で fork が lockfile を広く書き換えたため)。rebase 中の --ours は
          # upstream 側 (rebase 先) を指す。その commit の lockfile 変更は捨て、全 commit を
          # 載せ終えたあとの Regenerate step で package.json + overrides から作り直す。
          LOCK_RESOLVED=0
          for _ in $(seq 1 2000); do
            [ "$RC" = "0" ] && break
            [ -d "$(git rev-parse --git-path rebase-merge)" ] || break
            [ "$(git diff --name-only --diff-filter=U)" = "pnpm-lock.yaml" ] || break
            git checkout --ours -- pnpm-lock.yaml && git add pnpm-lock.yaml
            LOCK_RESOLVED=$((LOCK_RESOLVED + 1))
            echo "--- auto-resolved pnpm-lock.yaml conflict ($LOCK_RESOLVED)" >> /tmp/rebase.log
            if git diff --cached --quiet; then
              # lockfile だけを変える commit は空になるので飛ばす
              git rebase --skip >>/tmp/rebase.log 2>&1
            else
              GIT_EDITOR=true git rebase --continue >>/tmp/rebase.log 2>&1
            fi
            RC=$?
          done
          set -e
          echo "lock_resolved=$LOCK_RESOLVED" >> "$GITHUB_OUTPUT"
          if [ "$RC" = "0" ]; then
            echo "result=success" >> "$GITHUB_OUTPUT"
          else
            echo "result=conflict" >> "$GITHUB_OUTPUT"
            {
              echo 'conflict_files<<EOF'
              git diff --name-only --diff-filter=U | sort -u
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
            {
              echo 'rebase_log<<EOF'
              tail -n 80 /tmp/rebase.log
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
            git rebase --abort
          fi

      # lockfile の conflict を upstream 側で進めた場合だけ、Node + pnpm を入れて lockfile を
      # 作り直す (版は Dockerfile と同じく .node-version と package.json の packageManager)。
      # 失敗したら push せず、conflict と同じ Issue 経路に回す。
      - name: Regenerate pnpm-lock.yaml
        id: regen
        if: steps.rebase.outputs.result == 'success' && steps.rebase.outputs.lock_resolved != '0'
        working-directory: src
        run: |
          set +e
          (
            set -e
            case "$(uname -m)" in x86_64) ARCH=x64 ;; aarch64) ARCH=arm64 ;; *) ARCH=$(uname -m) ;; esac
            NODE_VERSION=$(cat .node-version)
            curl -fsSL "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-${ARCH}.tar.gz" \
              | tar -xz -C /usr/local --strip-components=1
            npm install -g --silent "$(node -p "require('./package.json').packageManager")"
            pnpm install --lockfile-only --ignore-scripts
            pnpm install --lockfile-only --frozen-lockfile --ignore-scripts
            git add pnpm-lock.yaml
            if ! git diff --cached --quiet; then
              git commit -q -m "chore(lockfile): upstream rebase 後に pnpm-lock.yaml を再生成" \
                -m "upstream-sync が pnpm-lock.yaml の conflict を upstream 側で進めたため (${{ steps.rebase.outputs.lock_resolved }} 回)、package.json と overrides から作り直した。"
            fi
          ) >/tmp/regen.log 2>&1
          RC=$?
          set -e
          if [ "$RC" = "0" ]; then
            echo "result=ok" >> "$GITHUB_OUTPUT"
            tail -n 5 /tmp/regen.log
          else
            echo "result=failed" >> "$GITHUB_OUTPUT"
            echo "conflict_files=pnpm-lock.yaml (rebase は通ったが lockfile の再生成に失敗)" >> "$GITHUB_OUTPUT"
            {
              echo 'regen_log<<EOF'
              tail -n 80 /tmp/regen.log
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Push rebased branch
        if: steps.rebase.outputs.result == 'success' && steps.regen.outputs.result != 'failed'
        working-directory: src
        run: |
          git push --force-with-lease origin bsky-integration

      - name: Open issue on conflict
        if: steps.rebase.outputs.result == 'conflict' || steps.regen.outputs.result == 'failed'
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          UP_SHORT: ${{ steps.fetch.outputs.upstream_short }}
          UP_HEAD: ${{ steps.fetch.outputs.upstream_head }}
          CONFLICT_FILES: ${{ steps.rebase.outputs.conflict_files || steps.regen.outputs.conflict_files }}
          REBASE_LOG: ${{ steps.rebase.outputs.rebase_log || steps.regen.outputs.regen_log }}
        run: |
          set -e
          BODY=$(cat <<EOF
          ## Upstream rebase conflict (upstream/master = \`$UP_SHORT\`)

          自動 rebase が conflict で失敗しました。手動で対応してください。

          ### conflict が出たファイル

          \`\`\`
          $CONFLICT_FILES
          \`\`\`

          ### 手元での再現

          \`\`\`fish
          cd ~/Document/misskey-bsky-fork
          git fetch upstream
          git checkout bsky-integration
          git rebase $UP_HEAD
          # conflict 解消後
          git rebase --continue
          git push --force-with-lease origin bsky-integration
          \`\`\`

          ### rebase ログ末尾 80 行

          \`\`\`
          $REBASE_LOG
          \`\`\`

          ---
          Workflow: \`upstream-sync.yml\`
          Run: ${{ gitea.server_url }}/${{ gitea.repository }}/actions/runs/${{ gitea.run_id }}
          EOF
          )
          API="${{ gitea.server_url }}/api/v1/repos/${{ gitea.repository }}"
          RUN_URL="${{ gitea.server_url }}/${{ gitea.repository }}/actions/runs/${{ gitea.run_id }}"
          TITLE_PREFIX="Upstream rebase conflict ("
          TITLE="Upstream rebase conflict ($UP_SHORT)"

          # 重複防止: open な conflict Issue は常に 1 件だけにする (2026-10-06、#4-#8 が同一
          # upstream head で毎晩重複起票された反省)。
          #   - 同じ upstream head の Issue が open → 何もしない (前回の起票内容のまま)
          #   - 別 head の Issue が open → その Issue の title/body を最新に差し替えてコメント
          #   - open が無い → 新規起票
          EXISTING=$(curl -fsS -H "Authorization: token $GITEA_TOKEN" \
              "$API/issues?state=open&type=issues&limit=50" \
            | jq -c --arg p "$TITLE_PREFIX" \
                '[.[] | select(.title | startswith($p))] | sort_by(.number) | last // empty')

          if [ -z "$EXISTING" ]; then
            jq -n --arg title "$TITLE" --arg body "$BODY" \
              '{title: $title, body: $body, labels: []}' \
              | curl -fsS -X POST \
                  -H "Authorization: token $GITEA_TOKEN" \
                  -H "Content-Type: application/json" \
                  --data @- \
                  "$API/issues" > /dev/null
            echo "::notice::Opened a new conflict issue: $TITLE"
          else
            NUM=$(jq -r '.number' <<<"$EXISTING")
            OLD_TITLE=$(jq -r '.title' <<<"$EXISTING")
            if [ "$OLD_TITLE" = "$TITLE" ]; then
              echo "::notice::Conflict issue #$NUM already open for upstream $UP_SHORT. Not opening another one."
            else
              jq -n --arg title "$TITLE" --arg body "$BODY" '{title: $title, body: $body}' \
                | curl -fsS -X PATCH \
                    -H "Authorization: token $GITEA_TOKEN" \
                    -H "Content-Type: application/json" \
                    --data @- \
                    "$API/issues/$NUM" > /dev/null
              COMMENT="upstream/master が \`$UP_SHORT\` に進みましたが、rebase の conflict は続いています。本文を最新の結果に差し替えました (更新前のタイトル: $OLD_TITLE)。 Run: $RUN_URL"
              jq -n --arg body "$COMMENT" '{body: $body}' \
                | curl -fsS -X POST \
                    -H "Authorization: token $GITEA_TOKEN" \
                    -H "Content-Type: application/json" \
                    --data @- \
                    "$API/issues/$NUM/comments" > /dev/null
              echo "::notice::Updated conflict issue #$NUM for upstream $UP_SHORT."
            fi
          fi
          exit 1
