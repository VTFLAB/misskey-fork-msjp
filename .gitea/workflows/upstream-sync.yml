# Upstream (github.com/misskey-dev/misskey) → bsky-integration 自動 rebase。
# 毎日 18:00 UTC = 03:00 JST に schedule で走る。手動でも workflow_dispatch から走らせられる。
# conflict 発生時は rebase --abort して Gitea Issue を立てて exit 1 (人間が手動 rebase)。
# open な conflict Issue が既にあれば新規起票せず、その Issue を使い回す (重複防止)。
# pnpm-lock.yaml・CHANGELOG.md・package.json だけの conflict は自動で解消して進める
# (.gitea/scripts/resolve-rebase-conflicts.py)。lockfile は rebase 後に作り直して commit する。
# サーバーの bot (msjp-bot) が「[sync] ...」Issue に `/sync` とコメントすると、03:00 を待たずに同じ手順で走る。
# そのときは結果を `[upgrade-status] ...` の行で Issue に書いて閉じる (bot がこの行を読んで管理者に伝える)。
# conflict の解消は upstream-conflict.yml (Claude) の担当。
name: Upstream Sync

# 2026-07-31: base を stable tag 2026.7.0 (master 系列) に載せ替えたため schedule を復活。
# alpha (develop 系列) tag をベースにする場合は、master への nightly rebase が base を
# 巻き戻してしまうので schedule を再び停止すること (2026-07-03 の前例を参照)。
on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * *'
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  sync:
    if: >-
      github.event_name != 'issue_comment' || (
        github.event.comment.body == '/sync' &&
        startsWith(github.event.issue.title, '[sync] ') &&
        (github.event.comment.user.login == 'msjp-bot' || github.event.comment.user.login == 'VTF')
      )
    runs-on: ubuntu-latest
    # Job container: debian:trixie-slim (理由は build-image.yml 冒頭を参照)。node が無いので
    # actions/checkout は使わず、GITEA_TOKEN 入り URL で git clone する。
    container:
      image: docker.io/library/debian:trixie-slim
    env:
      DEBIAN_FRONTEND: noninteractive
    defaults:
      run:
        shell: bash   # the image's sh is dash
    steps:
      - name: Toolchain
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git ca-certificates curl jq python3 > /dev/null

      # GITEA_TOKEN は workflow が自動で発行する短命 token。
      # force-with-lease push (origin URL に埋め込み) と issue 作成の両方に使う。
      - name: Checkout bsky-integration with full history
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          git clone -q -b bsky-integration \
            "https://x:${GITEA_TOKEN}@${GITHUB_SERVER_URL#https://}/${GITHUB_REPOSITORY}.git" src
          git -C src log --oneline -1

      - name: Configure git identity
        working-directory: src
        run: |
          git config user.name "gitea-actions[bot]"
          git config user.email "actions@git.msjp.pro"

      - name: Fetch upstream/master
        id: fetch
        working-directory: src
        run: |
          git remote add upstream https://github.com/misskey-dev/misskey.git
          git fetch upstream master --quiet
          UP_HEAD=$(git rev-parse upstream/master)
          UP_SHORT=$(git rev-parse --short upstream/master)
          echo "upstream_head=$UP_HEAD" >> "$GITHUB_OUTPUT"
          echo "upstream_short=$UP_SHORT" >> "$GITHUB_OUTPUT"

      - name: Skip if already rebased
        id: check
        working-directory: src
        run: |
          BASE=$(git merge-base bsky-integration upstream/master)
          if [ "$BASE" = "${{ steps.fetch.outputs.upstream_head }}" ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::bsky-integration already contains upstream/master (${{ steps.fetch.outputs.upstream_short }}). Nothing to rebase."
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Attempt rebase onto upstream/master
        id: rebase
        if: steps.check.outputs.needed == 'true'
        working-directory: src
        run: |
          set +e
          # rebase 中は作業ツリーが途中の commit に変わるので、解消用の script は先に取り出しておく
          cp .gitea/scripts/resolve-rebase-conflicts.py /tmp/resolve-rebase-conflicts.py
          git rebase upstream/master >/tmp/rebase.log 2>&1
          RC=$?
          # 判断の要らない conflict だけを自動で進める。rebase 中の --ours は upstream 側 (rebase 先)。
          #   - pnpm-lock.yaml: upstream 側を採り、全 commit を載せ終えたあとの Regenerate step で作り直す
          #     (2026-10-06、Dependabot 対応の overrides で fork が lockfile を広く書き換えたため)
          #   - CHANGELOG.md: upstream 側を採る。fork 独自の変更履歴は CHANGELOG.fork.md に書き、fork は
          #     CHANGELOG.md を編集しない (2026-11-12、release のたびに先頭への挿入同士が conflict していたため)
          #   - package.json: JSON として 3-way merge する。同じ key を両側が別の値に変えていたら諦める
          #     (2026-11-12、fork が足した依存の隣の行を upstream が版上げするたびに conflict していたため)
          # 対象外のファイルが 1 つでもあれば script は何も触らずに失敗し、この loop を抜けて conflict 扱いになる。
          : > /tmp/auto-resolved.tsv
          for _ in $(seq 1 2000); do
            [ "$RC" = "0" ] && break
            [ -d "$(git rev-parse --git-path rebase-merge)" ] || break
            python3 /tmp/resolve-rebase-conflicts.py >>/tmp/auto-resolved.tsv 2>>/tmp/rebase.log || break
            if git diff --cached --quiet; then
              # 解消した結果 commit が空になったら飛ばす
              git rebase --skip >>/tmp/rebase.log 2>&1
            else
              GIT_EDITOR=true git rebase --continue >>/tmp/rebase.log 2>&1
            fi
            RC=$?
          done
          set -e
          count() { awk -F'\t' -v k="$1" '$1 == k { n++ } END { print n + 0 }' /tmp/auto-resolved.tsv; }
          LOCK_RESOLVED=$(count lock)
          PKG_RESOLVED=$(count package-json)
          CHANGELOG_RESOLVED=$(count changelog)
          if [ -s /tmp/auto-resolved.tsv ]; then
            echo "--- auto-resolved conflicts (kind, path, commit):"
            cat /tmp/auto-resolved.tsv
          fi
          echo "lock_resolved=$LOCK_RESOLVED" >> "$GITHUB_OUTPUT"
          echo "pkg_resolved=$PKG_RESOLVED" >> "$GITHUB_OUTPUT"
          echo "changelog_resolved=$CHANGELOG_RESOLVED" >> "$GITHUB_OUTPUT"
          if [ "$RC" = "0" ]; then
            echo "result=success" >> "$GITHUB_OUTPUT"
          else
            echo "result=conflict" >> "$GITHUB_OUTPUT"
            {
              echo 'conflict_files<<EOF'
              git diff --name-only --diff-filter=U | sort -u
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
            {
              echo 'rebase_log<<EOF'
              tail -n 80 /tmp/rebase.log
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
            git rebase --abort
          fi

      # lockfile か package.json の conflict を自動で解消した場合だけ、Node + pnpm を入れて lockfile を
      # 作り直す (版は Dockerfile と同じく .node-version と package.json の packageManager)。
      # 起点は upstream の lockfile にする。rebase 中の git の自動 merge は lockfile を壊すことがある
      # (2026-10-27 の手作業の取り込みで実際に起きた)。失敗したら push せず、conflict と同じ Issue 経路に回す。
      - name: Regenerate pnpm-lock.yaml
        id: regen
        if: >-
          steps.rebase.outputs.result == 'success' &&
          (steps.rebase.outputs.lock_resolved != '0' || steps.rebase.outputs.pkg_resolved != '0')
        working-directory: src
        run: |
          set +e
          (
            set -e
            case "$(uname -m)" in x86_64) ARCH=x64 ;; aarch64) ARCH=arm64 ;; *) ARCH=$(uname -m) ;; esac
            NODE_VERSION=$(cat .node-version)
            printf '%s' "$NODE_VERSION" | grep -qxE '[0-9]+\.[0-9]+\.[0-9]+'
            curl -fsSL "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-${ARCH}.tar.gz" \
              | tar -xz -C /usr/local --strip-components=1
            # この job は GITEA_TOKEN 入りの URL で clone しているので、リポジトリの値をそのまま実行に回さない
            PM=$(node -p "require('./package.json').packageManager")
            printf '%s' "$PM" | grep -qxE 'pnpm@[0-9]+\.[0-9]+\.[0-9]+'
            npm install -g --silent "$PM"
            git show upstream/master:pnpm-lock.yaml > pnpm-lock.yaml
            # CI=true では pnpm が frozen-lockfile を既定にするため明示的に外す。.pnpmfile.cjs も読ませない
            pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts --ignore-pnpmfile
            pnpm install --lockfile-only --frozen-lockfile --ignore-scripts --ignore-pnpmfile
            git add pnpm-lock.yaml
            if ! git diff --cached --quiet; then
              git commit -q -m "chore(lockfile): upstream rebase 後に pnpm-lock.yaml を再生成" \
                -m "upstream-sync が pnpm-lock.yaml (${{ steps.rebase.outputs.lock_resolved }} 回) と package.json (${{ steps.rebase.outputs.pkg_resolved }} 回) の conflict を自動で解消したため、upstream の pnpm-lock.yaml から package.json と overrides に合わせて作り直した。"
            fi
          ) >/tmp/regen.log 2>&1
          RC=$?
          set -e
          if [ "$RC" = "0" ]; then
            echo "result=ok" >> "$GITHUB_OUTPUT"
            tail -n 5 /tmp/regen.log
          else
            echo "result=failed" >> "$GITHUB_OUTPUT"
            echo "conflict_files=pnpm-lock.yaml (rebase は通ったが lockfile の再生成に失敗)" >> "$GITHUB_OUTPUT"
            {
              echo 'regen_log<<EOF'
              tail -n 80 /tmp/regen.log
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Push rebased branch
        id: push
        if: steps.rebase.outputs.result == 'success' && steps.regen.outputs.result != 'failed'
        working-directory: src
        run: |
          git push --force-with-lease origin bsky-integration

      - name: Open issue on conflict
        if: steps.rebase.outputs.result == 'conflict' || steps.regen.outputs.result == 'failed'
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          UP_SHORT: ${{ steps.fetch.outputs.upstream_short }}
          UP_HEAD: ${{ steps.fetch.outputs.upstream_head }}
          CONFLICT_FILES: ${{ steps.rebase.outputs.conflict_files || steps.regen.outputs.conflict_files }}
          REBASE_LOG: ${{ steps.rebase.outputs.rebase_log || steps.regen.outputs.regen_log }}
        run: |
          set -e
          BODY=$(cat <<EOF
          ## Upstream rebase conflict (upstream/master = \`$UP_SHORT\`)

          自動 rebase が conflict で失敗しました。手動で対応してください。

          ### conflict が出たファイル

          \`\`\`
          $CONFLICT_FILES
          \`\`\`

          ### 手元での再現

          \`\`\`fish
          cd ~/Document/misskey-bsky-fork
          git fetch upstream
          git checkout bsky-integration
          git rebase $UP_HEAD
          # conflict 解消後
          git rebase --continue
          git push --force-with-lease origin bsky-integration
          \`\`\`

          ### rebase ログ末尾 80 行

          \`\`\`
          $REBASE_LOG
          \`\`\`

          ---
          Workflow: \`upstream-sync.yml\`
          Run: ${{ gitea.server_url }}/${{ gitea.repository }}/actions/runs/${{ gitea.run_id }}
          EOF
          )
          API="${{ gitea.server_url }}/api/v1/repos/${{ gitea.repository }}"
          RUN_URL="${{ gitea.server_url }}/${{ gitea.repository }}/actions/runs/${{ gitea.run_id }}"
          TITLE_PREFIX="Upstream rebase conflict ("
          TITLE="Upstream rebase conflict ($UP_SHORT)"

          # 重複防止: open な conflict Issue は常に 1 件だけにする (2026-10-06、#4-#8 が同一
          # upstream head で毎晩重複起票された反省)。
          #   - 同じ upstream head の Issue が open → 何もしない (前回の起票内容のまま)
          #   - 別 head の Issue が open → その Issue の title/body を最新に差し替えてコメント
          #   - open が無い → 新規起票
          EXISTING=$(curl -fsS -H "Authorization: token $GITEA_TOKEN" \
              "$API/issues?state=open&type=issues&limit=50" \
            | jq -c --arg p "$TITLE_PREFIX" \
                '[.[] | select(.title | startswith($p))] | sort_by(.number) | last // empty')

          if [ -z "$EXISTING" ]; then
            jq -n --arg title "$TITLE" --arg body "$BODY" \
              '{title: $title, body: $body, labels: []}' \
              | curl -fsS -X POST \
                  -H "Authorization: token $GITEA_TOKEN" \
                  -H "Content-Type: application/json" \
                  --data @- \
                  "$API/issues" > /dev/null
            echo "::notice::Opened a new conflict issue: $TITLE"
          else
            NUM=$(jq -r '.number' <<<"$EXISTING")
            OLD_TITLE=$(jq -r '.title' <<<"$EXISTING")
            if [ "$OLD_TITLE" = "$TITLE" ]; then
              echo "::notice::Conflict issue #$NUM already open for upstream $UP_SHORT. Not opening another one."
            else
              jq -n --arg title "$TITLE" --arg body "$BODY" '{title: $title, body: $body}' \
                | curl -fsS -X PATCH \
                    -H "Authorization: token $GITEA_TOKEN" \
                    -H "Content-Type: application/json" \
                    --data @- \
                    "$API/issues/$NUM" > /dev/null
              COMMENT="upstream/master が \`$UP_SHORT\` に進みましたが、rebase の conflict は続いています。本文を最新の結果に差し替えました (更新前のタイトル: $OLD_TITLE)。 Run: $RUN_URL"
              jq -n --arg body "$COMMENT" '{body: $body}' \
                | curl -fsS -X POST \
                    -H "Authorization: token $GITEA_TOKEN" \
                    -H "Content-Type: application/json" \
                    --data @- \
                    "$API/issues/$NUM/comments" > /dev/null
              echo "::notice::Updated conflict issue #$NUM for upstream $UP_SHORT."
            fi
          fi
          exit 1

      # msjp-bot の `/sync` から起動したときだけ、結果を [sync] Issue に書いて閉じる。
      # 1 行目の `[upgrade-status] <state> [key=value ...]` は bot が読む決まった形式。
      - name: Report to the sync request issue
        if: always() && github.event_name == 'issue_comment'
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          NEEDED: ${{ steps.check.outputs.needed }}
          REBASE: ${{ steps.rebase.outputs.result }}
          REGEN: ${{ steps.regen.outputs.result }}
          PUSHED: ${{ steps.push.outcome }}
          LOCK_N: ${{ steps.rebase.outputs.lock_resolved }}
          PKG_N: ${{ steps.rebase.outputs.pkg_resolved }}
          CHANGELOG_N: ${{ steps.rebase.outputs.changelog_resolved }}
          ISSUE: ${{ github.event.issue.number }}
          RUN_URL: ${{ gitea.server_url }}/${{ gitea.repository }}/actions/runs/${{ gitea.run_id }}
          API: ${{ gitea.server_url }}/api/v1/repos/${{ gitea.repository }}/issues/${{ github.event.issue.number }}
        run: |
          VERSION=$(sed -nE 's/^[[:space:]]*"version": *"([^"]+)".*/\1/p' src/package.json 2>/dev/null | head -n 1)
          if [ "$NEEDED" = "false" ]; then
            BODY="[upgrade-status] done note=up-to-date version=$VERSION"$'\n\n'"upstream/master はもう取り込み済みだったよ。"
          elif [ "$PUSHED" = "success" ]; then
            if [ "${LOCK_N:-0}${PKG_N:-0}${CHANGELOG_N:-0}" = "000" ]; then
              BODY="[upgrade-status] synced version=$VERSION"$'\n\n'"conflict は無かったから、そのまま push したよ。build と本番への反映はこれから。"
            else
              BODY="[upgrade-status] synced version=$VERSION"$'\n\n'"決まった方法で直せる conflict だけだったから、自動で直して push したよ (pnpm-lock.yaml ${LOCK_N:-0} 回、package.json ${PKG_N:-0} 回、CHANGELOG.md ${CHANGELOG_N:-0} 回)。build と本番への反映はこれから。"
              if [ "${CHANGELOG_N:-0}" != "0" ]; then
                BODY="$BODY"$'\n'"CHANGELOG.md に入っていた fork 側の変更は捨てたから、必要なら CHANGELOG.fork.md に書き直してね。"
              fi
            fi
          elif [ "$REBASE" = "conflict" ] || [ "$REGEN" = "failed" ]; then
            BODY="[upgrade-status] conflict"$'\n\n'"conflict が出たから、Upstream rebase conflict の Issue を立てたよ。"
          else
            BODY="[upgrade-status] failed"$'\n\n'"取り込みの途中で失敗したよ。Actions のログを見てね: $RUN_URL"
          fi
          jq -n --arg body "$BODY" '{body: $body}' \
            | curl -fsS -X POST -H "Authorization: token $GITEA_TOKEN" -H "Content-Type: application/json" --data @- "$API/comments" > /dev/null
          curl -fsS -X PATCH -H "Authorization: token $GITEA_TOKEN" -H "Content-Type: application/json" \
            --data '{"state":"closed"}' "$API" > /dev/null
