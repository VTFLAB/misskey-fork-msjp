packages:
  - packages/backend
  - packages/frontend-shared
  - packages/frontend
  - packages/frontend-builder
  - packages/frontend-embed
  - packages/i18n
  - packages/icons-subsetter
  - packages/sw
  - packages/misskey-js
  - packages/misskey-js/generator
  - packages/misskey-reversi
  - packages/misskey-bubble-game
  - packages-private/*
allowBuilds:
  '@nestjs/core': true
  '@parcel/watcher': true
  '@sentry/profiling-node': true
  '@sentry-internal/node-cpu-profiler': true
  '@sentry/node-cpu-profiler': true
  bufferutil: true
  canvas: true
  core-js: true
  esbuild: true
  msgpackr-extract: true
  msw: true
  nice-napi: true
  re2: true
  sharp: true
  utf-8-validate: true
  v-code-diff: true
  vue-demi: true
  exifreader: false
  # ライブ字幕のローカルWASM翻訳エンジン (@huggingface/transformers) の依存。
  # ブラウザではonnxruntime-web(wasm)側が使われ、onnxruntime-nodeのネイティブ
  # バイナリ取得スクリプトはfrontendでは不要なため実行しない (bsky-fork 独自)
  onnxruntime-node: false
  protobufjs: false
  pnpm: true
minimumReleaseAge: 10080 # delay 7days to mitigate supply-chain attack
minimumReleaseAgeExclude:
  - '@misskey-dev/*'
  - '@syuilo/aiscript'
  - buraha
  - mfm-js
  - slacc
  - slacc-android-arm-eabi
  - slacc-android-arm64
  - slacc-darwin-arm64
  - slacc-darwin-universal
  - slacc-darwin-x64
  - slacc-freebsd-x64
  - slacc-linux-arm-gnueabihf
  - slacc-linux-arm64-gnu
  - slacc-linux-arm64-musl
  - slacc-linux-x64-gnu
  - slacc-linux-x64-musl
  - slacc-win32-arm64-msvc
  - slacc-win32-x64-msvc
  - '@typescript/native-preview*'
  - undici@6.28.1 || 7.29.1 # そのうち消す
  # Renovate security update: nodemailer@9.1.1
  - nodemailer@9.1.1
  # Renovate security update: fastify@5.12.5
  - fastify@5.12.5
overrides:
  # bsky-fork: Dependabot security alerts (2026-10-06). Each entry lifts a vulnerable
  # transitive version to a patched release in the same major line (all >= 7 days old).
  # Kept as one block at the top so upstream edits at the end do not conflict.
  # Drop an entry once upstream's own dependency updates make it redundant.
  '@fastify/busboy@^3': 3.2.2
  '@hapi/wreck@^18': 18.1.2
  '@huggingface/transformers>onnxruntime-node': '-' # node-only, pulls adm-zip; the browser build uses onnxruntime-web
  '@huggingface/transformers>sharp': '-' # node-only; the browser build never imports it
  '@misskey-dev/summaly>fastify': 5.12.5
  '@xmldom/xmldom@~0.9': 0.9.12
  axios@^1: 1.20.0
  body-parser@^2: 2.3.0
  brace-expansion@^1: 1.1.21
  brace-expansion@^2: 2.1.7
  brace-expansion@^5: 5.0.12
  fast-uri@^3: 3.1.8
  fast-uri@^4: 4.2.1
  find-my-way@^9: 9.9.0
  immutable@^5: 5.1.9
  ip-cidr>ip-address: 10.7.2 # ip-cidr 4.0.2 (latest) declares ^9; get-ip-hash.ts only uses createAddress().mask(), which works on 10.x
  joi@^17: 17.13.8
  joi@^18: 18.2.9
  js-cookie@^3: 3.0.8
  js-yaml@^4: 4.3.2
  multer@^2: 2.4.0
  qs@^6: 6.16.0
  undici@^8: 8.11.2
  uuid@<11.1.1: 11.1.1
  # end bsky-fork
  '@aiscript-dev/aiscript-languageserver': '-'
  chokidar: 5.0.0
  lodash: 4.18.1
  undici@^7: 7.29.1
  undici@^6: 6.28.1
  '@tabler/icons-webfont>sharp': '-'
engineStrict: true
saveExact: true
shellEmulator: true
